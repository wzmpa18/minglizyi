name: Android Build (APK + AAB)

# 言道国学 Android 云打包（fc12）
# - ubuntu runner + Capacitor Android 工程（内置资源模式）
# - 签名：仓库根 yandao-release.keystore（经 ANDROID_KEYSTORE_B64 Secret 注入）
#   Secret 配置：base64 -w0 yandao-release.keystore 的输出 → ANDROID_KEYSTORE_B64
#   签名口令见 android/app/build.gradle（构建配置必需，keystore 本体不入库）
on:
  workflow_dispatch:
    inputs:
      store_channel:
        description: Store channel for embedded review gates
        required: true
        default: tencent
        type: choice
        options:
          - tencent
          - google
          - huawei
          - oppo
          - vivo
          - honor
          - xiaomi
          - appchina
          - internal
      challenge_base64:
        description: Optional official Tencent ownership challenge; sign only, no app rebuild
        required: false
        default: ''
        type: string
      challenge_sha256:
        description: SHA256 required with ownership challenge
        required: false
        default: ''
        type: string

jobs:
  claim-proof:
    if: ${{ inputs.challenge_base64 != '' }}
    uses: ./.github/workflows/tencent-claim-proof.yml
    with:
      challenge_base64: ${{ inputs.challenge_base64 }}
      challenge_sha256: ${{ inputs.challenge_sha256 }}
    secrets:
      ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
  build:
    if: ${{ inputs.challenge_base64 == '' }}
    name: Assemble Release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_NAME: 言道国学
      BUNDLE_ID: com.yandao.guoxue
      NEXT_PUBLIC_STORE_CHANNEL: ${{ inputs.store_channel || 'tencent' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build web bundle (native assets)
        run: |
          npm run build
          node scripts/verify-static-cache-boundary.cjs
          test -f out/index.html || { echo "FATAL: 静态导出产物缺失 out/index.html"; exit 1; }
          test -f out/academy/start/index.html || { echo "FATAL: 入门学习页面未导出"; exit 1; }
          grep -R -q '错题重练' out/_next/static/chunks || { echo "FATAL: 入门课练习功能未进入构建"; exit 1; }
          grep -q '__nativeApiPatchInstalled' out/index.html || { echo "FATAL: 原生 API 改写脚本未内联进 HTML（layout 注入缺失）"; exit 1; }
          if [ "$NEXT_PUBLIC_STORE_CHANNEL" = "google" ]; then
            test -f out/discover/index.html || { echo "FATAL: Google 渠道社区入口缺失"; exit 1; }
            grep -R -q 'Google Play 版暂未开放购买功能' out/_next/static/chunks || { echo "FATAL: Google 渠道购买拦截未进入构建"; exit 1; }
            grep -R -q 'X-Store-Channel' out/_next/static/chunks || { echo "FATAL: Google 渠道标识请求头未进入构建"; exit 1; }
            echo "Google 渠道门禁 OK: 社区保留，外部数字内容购买关闭"
          fi
          rm -rf www
          mkdir -p www
          cp -r out/. www/
          echo "www 内置资源: $(find www -type f | wc -l) files, $(du -sh www | cut -f1)"

      - name: Verify and bundle pinned offline Chinese OCR model and native library
        run: python3 scripts/prepare_life_ocr_models.py

      - name: Sync Capacitor Android
        run: |
          node scripts/write-native-marker.js
          test -f www/app-native.json || { echo "FATAL: 原生版本标记未生成"; exit 1; }
          npx cap sync android
          test -f android/app/src/main/assets/public/index.html || { echo "FATAL: Android assets 未同步内置资源"; exit 1; }
          test -f android/app/src/main/assets/public/native-api-patch.js || { echo "FATAL: native-api-patch.js 未进入 Android assets"; exit 1; }
          test -f android/app/src/main/assets/public/app-native.json || { echo "FATAL: app-native.json 未进入 APK 资源"; exit 1; }
          node scripts/verify-android-identity.js
          if grep -q '"url":' android/app/src/main/assets/capacitor.config.json; then
            echo "FATAL: capacitor.config 仍含 server.url（远程加载模式残留）"; exit 1
          fi
          echo "原生模式校验 OK: 内置资源已同步且无 server.url 残留"

      - name: Restore keystore
        run: |
          printf '%s' "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > yandao-release.keystore
          ls -la yandao-release.keystore
          test -s yandao-release.keystore || { echo "FATAL: keystore empty"; exit 1; }

      - name: Verify version gate
        run: |
          node scripts/verify-android-identity.js
          grep -Fq "versionName \"$APP_VERSION_NAME\"" android/app/build.gradle || { echo "FATAL: versionName 与已验证版本不一致"; exit 1; }
          echo "版本门禁 OK: versionCode $APP_VERSION_CODE / versionName $APP_VERSION_NAME"

      - name: Build release APK and AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Show APK info
        run: |
          ls -la android/app/build/outputs/apk/release/
          APK="android/app/build/outputs/apk/release/app-release.apk"
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$AAPT" dump badging "$APK" | head -2
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          ACTUAL_SHA256=$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^.*certificate SHA-256 digest: //p' | head -1 | tr '[:upper:]' '[:lower:]')
          EXPECTED_SHA256="8ca0c414573d4b05fc2bd1ba9c6a2a8090c90c58e3815119494607443dc6d5a0"
          test "$ACTUAL_SHA256" = "$EXPECTED_SHA256" || { echo "FATAL: 签名指纹与正式包不一致"; exit 1; }
          echo "签名门禁 OK: $ACTUAL_SHA256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: yandao-guoxue-android-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Verify and upload AAB artifact
        run: |
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          test -s "$AAB" || { echo "FATAL: AAB missing"; exit 1; }
          jarsigner -verify -verbose -certs "$AAB" >/dev/null
          echo "AAB 签名与结构校验 OK"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: yandao-guoxue-android-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 14

      - name: Build summary
        run: |
          echo "### Android 构建结果" >> $GITHUB_STEP_SUMMARY
          echo "- Bundle: $BUNDLE_ID (versionCode $APP_VERSION_CODE / versionName $APP_VERSION_NAME)" >> $GITHUB_STEP_SUMMARY
          echo "- 渠道: $NEXT_PUBLIC_STORE_CHANNEL（Google 渠道关闭外部数字内容购买入口）" >> $GITHUB_STEP_SUMMARY
          echo "- 模式: 原生内置资源 (v$APP_VERSION_NAME, API 指向 https://yandaoguoxue.yandao.vip)" >> $GITHUB_STEP_SUMMARY
          echo "- 产物: signed release APK + Google Play AAB" >> $GITHUB_STEP_SUMMARY
