name: Android calendar consent regression
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  consent:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NEXT_PUBLIC_STORE_CHANNEL: xiaomi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --legacy-peer-deps
      - name: Prepare actual application
        run: |
          npm run build
          mkdir -p www
          cp -R out/. www/
          node scripts/write-native-marker.js
          python3 scripts/prepare_life_ocr_models.py
          npx cap sync android
          chmod +x android/gradlew
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: default
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: cd android && ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.yandao.guoxue.CalendarReminderConsentTest --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calendar-consent-regression
          path: android/app/build/outputs/androidTest-results/
          retention-days: 7
