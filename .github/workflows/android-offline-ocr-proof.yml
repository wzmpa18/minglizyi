name: Android offline OCR AOSP proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --legacy-peer-deps
      - name: Prepare pinned offline engine and actual test assets
        run: |
          python3 scripts/prepare_life_ocr_models.py
          mkdir -p www android/app/src/androidTest/assets
          printf '<!doctype html><title>Native OCR instrumentation only</title>' > www/index.html
          cp scripts/fixtures/life-ocr-synthetic.png android/app/src/androidTest/assets/
          npx cap sync android
          chmod +x android/gradlew
      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          disable-animations: true
          script: |
            adb shell settings put global airplane_mode_on 1
            adb shell am broadcast -a android.intent.action.AIRPLANE_MODE --ez state true
            adb shell svc wifi disable
            adb shell svc data disable
            bash scripts/run_android_offline_ocr_proof.sh
      - name: Preserve actual native synthetic-only result
        if: always()
        run: adb pull /sdcard/Android/data/com.yandao.guoxue/files/qa-ocr-synthetic.json android/app/build/reports/androidTests/ || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-offline-ocr-native-proof
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
          retention-days: 2
