name: Verify Guoxue App Store Connect credential
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read only Guoxue app metadata
        env:
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          node <<'JS'
          const crypto = require('node:crypto');
          (async () => {
            const { ASC_PRIVATE_KEY, ASC_KEY_ID, ASC_ISSUER } = process.env;
            if (!ASC_PRIVATE_KEY || !ASC_KEY_ID || !ASC_ISSUER) throw new Error('Missing credential configuration');
            const key = crypto.createPrivateKey(ASC_PRIVATE_KEY);
            if (key.asymmetricKeyType !== 'ec' || key.asymmetricKeyDetails.namedCurve !== 'prime256v1') throw new Error('Expected P-256 key');
            const now = Math.floor(Date.now()/1000);
            const encode = value => Buffer.from(JSON.stringify(value)).toString('base64url');
            const input = encode({alg:'ES256',kid:ASC_KEY_ID,typ:'JWT'})+'.'+encode({iss:ASC_ISSUER,iat:now-30,exp:now+300,aud:'appstoreconnect-v1'});
            const token = input+'.'+crypto.sign('sha256',Buffer.from(input),{key,dsaEncoding:'ieee-p1363'}).toString('base64url');
            const response = await fetch('https://api.appstoreconnect.apple.com/v1/apps/6807592575?fields[apps]=name,bundleId', {
              headers: {Authorization:'Bearer '+token}, signal: AbortSignal.timeout(20000)
            });
            if (!response.ok) throw new Error('Apple API HTTP '+response.status);
            const {data} = await response.json();
            if (data.id !== '6807592575' || data.attributes.bundleId !== 'com.yandaoguoxue.app') throw new Error('App mismatch');
            console.log('PASS: repository credential reads Guoxue app 6807592575 (com.yandaoguoxue.app). No app or review mutation.');
          })().catch(() => { console.error('Credential verification failed; private values suppressed.'); process.exitCode=1; });
          JS
