name: iOS Build (ipa)

# 言道国学 iOS 打包管道（v25.0.78：手动签名——分发证书+App Store profile 资产化）
# 背景：ASC 团队实际注册的 App ID 是 com.yandaoguoxue.app（App 记录「言道国学」也在用它），
#   原 com.yandao.guoxue 从未注册——exportArchive 云签名自动注册链路报 Cloud signing
#   permission error（2026-09-02 实测：密钥本身为 Admin 级，可正常创建证书/profile，
#   失败仅因 bundle ID 未注册）。Android 包名保持 com.yandao.guoxue 不变，两者互不影响。
# 签名资产（2026-09-02 经 ASC API 创建，有效期至 2027-09-02）：
#   Apple Distribution 证书 id=6YJFBTVSBX（.p12 含私钥+证书）
#   App Store profile name=yandao guoxue iOS App Store 20260902（uuid 917802a5-6e9b-432d-9710-ca862a4007fc）
# Secrets 必需：
#   IOS_DIST_CERT_P12_B64     — dist.p12 文件 base64
#   IOS_DIST_P12_PASSWORD     — .p12 导出密码
#   IOS_APPSTORE_PROFILE_B64  — .mobileprovision 文件 base64
#   APP_STORE_CONNECT_KEY     — AuthKey_UWQ354QP54.p8 全文内容（TestFlight 上传用）
#   APP_STORE_CONNECT_ISSUER_ID — App Store Connect 后台 Issuer ID
# 流程：未签名归档（CODE_SIGNING_ALLOWED=NO）→ 导入 keychain+profile →
#   exportArchive manual signing（provisioningProfiles 指定）→ 可选 altool 上传 TestFlight
on:
  workflow_dispatch:
    inputs:
      upload_testflight:
        description: '签名成功后上传 TestFlight'
        type: boolean
        default: false

jobs:
  build:
    name: Archive & Export
    runs-on: macos-15
    timeout-minutes: 60
    env:
      # Key ID 可被仓库 secret ASC_KEY_ID 覆盖
      KEY_ID: ${{ secrets.ASC_KEY_ID || 'UWQ354QP54' }}
      TEAM_ID: WM586465ZD
      APP_NAME: 言道国学
      BUNDLE_ID: com.yandaoguoxue.app
      PROFILE_NAME: yandao guoxue iOS App Store 20260902

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Capacitor 8.5.0 预编译框架（capacitor-swift-pm 二进制包）的 Swift 模块接口
      # 需 Xcode 16+ 编译器消费——Xcode 15.4 下 @capacitor/share 插件 Swift 源码报
      # getString 双参数/CAPPluginCall 无 reject（Swift 扩展不可见）。固定 16.4。
      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle (native assets)
        run: |
          npm run build
          test -f out/index.html || { echo "FATAL: 静态导出产物缺失 out/index.html"; exit 1; }
          grep -q '__nativeApiPatchInstalled' out/index.html || { echo "FATAL: 原生 API 改写脚本未内联进 HTML（layout 注入缺失）"; exit 1; }
          rm -rf www
          mkdir -p www
          cp -r out/. www/
          echo "www 内置资源: $(find www -type f | wc -l) files, $(du -sh www | cut -f1)"

      - name: Sync Capacitor iOS
        run: |
          npx cap sync ios
          test -f ios/App/App/public/index.html || { echo "FATAL: iOS assets 未同步内置资源"; exit 1; }
          test -f ios/App/App/public/native-api-patch.js || { echo "FATAL: native-api-patch.js 未进入 iOS assets"; exit 1; }
          if grep -q '"url":' ios/App/App/capacitor.config.json; then
            echo "FATAL: capacitor.config 仍含 server.url（远程加载模式残留）"; exit 1
          fi
          echo "原生模式校验 OK: 内置资源已同步且无 server.url 残留"

      - name: Check signing credentials
        id: creds
        run: |
          if [ -n "${{ secrets.IOS_DIST_CERT_P12_B64 }}" ] && [ -n "${{ secrets.IOS_DIST_P12_PASSWORD }}" ] && [ -n "${{ secrets.IOS_APPSTORE_PROFILE_B64 }}" ]; then
            echo "mode=signed" >> "$GITHUB_OUTPUT"
            echo "签名模式：手动签名（分发证书 .p12 + App Store profile 资产化）"
          else
            echo "mode=unsigned" >> "$GITHUB_OUTPUT"
            echo "::warning::缺少 IOS_DIST_CERT_P12_B64 / IOS_DIST_P12_PASSWORD / IOS_APPSTORE_PROFILE_B64 Secrets，将产出未签名 xcarchive"
          fi

      # TestFlight 上传需要 ASC API 密钥（altool 从 ~/private_keys/ 读取）
      - name: Write API key
        if: inputs.upload_testflight
        env:
          ASC_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
        run: |
          mkdir -p "$HOME/private_keys"
          printf '%s\n' "$ASC_KEY" > "$HOME/private_keys/AuthKey_${KEY_ID}.p8"

      - name: Import signing assets
        if: steps.creds.outputs.mode == 'signed'
        env:
          DIST_P12_B64: ${{ secrets.IOS_DIST_CERT_P12_B64 }}
          DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_APPSTORE_PROFILE_B64 }}
          EXPECTED_PROFILE_UUID: 917802a5-6e9b-432d-9710-ca862a4007fc
        run: |
          set -e
          KEYCHAIN_DB=ci-build.keychain-db
          KEYCHAIN_PW=$(head -c 24 /dev/urandom | base64 | tr -d '/+=')
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN_DB"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN_DB"
          security set-keychain-settings -t 3600 -u "$KEYCHAIN_DB"
          printf '%s' "$DIST_P12_B64" | base64 -d > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN_DB" -P "$DIST_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "$KEYCHAIN_DB" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PW" "$KEYCHAIN_DB" || true
          security find-identity -v -p codesigning "$KEYCHAIN_DB"

          PP_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PP_DIR"
          printf '%s' "$PROFILE_B64" | base64 -d > "$RUNNER_TEMP/app.mobileprovision"
          # PlistBuddy 读管道 /dev/stdin 不可 seek 会失败（Cannot parse a NULL or zero-length
          # data），plutil 从 stdin 解析是管道安全的
          PP_UUID=$(security cms -D -i "$RUNNER_TEMP/app.mobileprovision" | plutil -extract UUID raw -o - -)
          if [ "$PP_UUID" != "$EXPECTED_PROFILE_UUID" ]; then
            echo "FATAL: profile UUID 不匹配（实际 $PP_UUID，期望 $EXPECTED_PROFILE_UUID）——Secret 与工作流 UUID 常量需同步更新"
            exit 1
          fi
          cp "$RUNNER_TEMP/app.mobileprovision" "$PP_DIR/$PP_UUID.mobileprovision"
          echo "profile 安装完成: $PP_UUID.mobileprovision"

      # 归档一律未签名（签名在导出阶段完成，避免归档期签名资产依赖）
      - name: Archive (unsigned)
        run: |
          cd ios/App
          rm -rf "$RUNNER_TEMP/App.xcarchive"
          xcodebuild archive \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO

      # 分发签名：manual 模式，provisioningProfiles 按 profile 名称匹配
      - name: Export ipa (manual signing)
        id: export
        if: steps.creds.outputs.mode == 'signed'
        continue-on-error: true
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>WM586465ZD</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.yandaoguoxue.app</key>
              <string>yandao guoxue iOS App Store 20260902</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
            <key>stripSwiftSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"
          ls -la "$RUNNER_TEMP/export"
          IPA=$(ls "$RUNNER_TEMP/export/"*.ipa | head -1)
          echo "ipa_size=$(du -h "$IPA" | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload ipa artifact
        if: steps.creds.outputs.mode == 'signed' && steps.export.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: yandao-guoxue-ios-ipa
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 14

      - name: Upload to TestFlight
        if: steps.creds.outputs.mode == 'signed' && steps.export.outcome == 'success' && inputs.upload_testflight
        run: |
          IPA=$(ls "$RUNNER_TEMP/export/"*.ipa | head -1)
          xcrun altool --upload-app --type ios -f "$IPA" --apiKey "$KEY_ID" --api-issuer "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}"

      - name: Upload unsigned xcarchive artifact
        if: steps.creds.outputs.mode == 'unsigned' || steps.export.outcome == 'failure'
        run: |
          cd "$RUNNER_TEMP"
          zip -r -q App.xcarchive.zip App.xcarchive

      - name: Upload archive artifact
        if: steps.creds.outputs.mode == 'unsigned' || steps.export.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: yandao-guoxue-ios-xcarchive-unsigned
          path: ${{ runner.temp }}/App.xcarchive.zip
          retention-days: 14

      - name: Build summary
        if: always()
        run: |
          echo "### iOS 构建结果" >> $GITHUB_STEP_SUMMARY
          echo "- 模式: ${{ steps.creds.outputs.mode }}（手动签名）" >> $GITHUB_STEP_SUMMARY
          echo "- Bundle: $BUNDLE_ID" >> $GITHUB_STEP_SUMMARY
          echo "- 资源: 原生内置 (API 改写到 https://yandaoguoxue.yandao.vip)" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.creds.outputs.mode }}" = "signed" ] && [ "${{ steps.export.outcome }}" = "success" ]; then
            echo "- 产物: 签名 ipa（manual 签名；TestFlight 上传: ${{ inputs.upload_testflight }}）" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.creds.outputs.mode }}" = "signed" ]; then
            echo "- 产物: 未签名 xcarchive（exportArchive 失败已降级，见 Export ipa 步骤日志）" >> $GITHUB_STEP_SUMMARY
            echo "- 常见根因：profile 与 Bundle ID 不匹配 / .p12 密码错误 / 证书过期" >> $GITHUB_STEP_SUMMARY
          else
            echo "- 产物: 未签名 xcarchive（需补签名 Secrets 后重跑可出签名 ipa）" >> $GITHUB_STEP_SUMMARY
          fi
