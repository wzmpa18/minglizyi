name: iOS Build (ipa)

# 言道国学 iOS 打包管道（v25.0.77 重构：归档/签名分离）
# 签名策略（geolibre 同源问题解法）：Automatic 开发签名归档会要求注册设备
#   （"no devices to generate provisioning profile"），且显式 Apple Distribution
#   会报 "conflicting provisioning settings"。正确姿势：归档阶段 CODE_SIGNING_ALLOWED=NO
#   产出未签名 xcarchive，再由 -exportArchive + ASC API 密钥完成 App Store 分发签名
#   ——自动创建 Apple Distribution 证书、注册 App ID、生成 App Store profile，无需设备。
# - 签名：App Store Connect API（P8 密钥）
#   Secrets 必需：
#     APP_STORE_CONNECT_KEY       — AuthKey_UWQ354QP54.p8 全文内容
#     APP_STORE_CONNECT_ISSUER_ID — App Store Connect 后台 → 用户和访问 → 集成 → 密钥 页的 Issuer ID
#   Key ID 已内联（UWQ354QP54，非敏感标识）Team ID 内联（WM586465ZD）
# - Issuer ID 未配置时：产出未签名 xcarchive（可在任意 Mac 上完成签名导出）
on:
  workflow_dispatch:
    inputs:
      upload_testflight:
        description: '签名成功后上传 TestFlight'
        type: boolean
        default: false

jobs:
  build:
    name: Archive & Export
    runs-on: macos-15
    timeout-minutes: 60
    env:
      KEY_ID: UWQ354QP54
      TEAM_ID: WM586465ZD
      APP_NAME: 言道国学
      BUNDLE_ID: com.yandao.guoxue

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Capacitor 8.5.0 预编译框架（capacitor-swift-pm 二进制包）的 Swift 模块接口
      # 需 Xcode 16+ 编译器消费——Xcode 15.4 下 @capacitor/share 插件 Swift 源码报
      # getString 双参数/CAPPluginCall 无 reject（Swift 扩展不可见）。固定 16.4。
      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle (native assets)
        run: |
          npm run build
          test -f out/index.html || { echo "FATAL: 静态导出产物缺失 out/index.html"; exit 1; }
          grep -q '__nativeApiPatchInstalled' out/index.html || { echo "FATAL: 原生 API 改写脚本未内联进 HTML（layout 注入缺失）"; exit 1; }
          rm -rf www
          mkdir -p www
          cp -r out/. www/
          echo "www 内置资源: $(find www -type f | wc -l) files, $(du -sh www | cut -f1)"

      - name: Sync Capacitor iOS
        run: |
          npx cap sync ios
          test -f ios/App/App/public/index.html || { echo "FATAL: iOS assets 未同步内置资源"; exit 1; }
          test -f ios/App/App/public/native-api-patch.js || { echo "FATAL: native-api-patch.js 未进入 iOS assets"; exit 1; }
          if grep -q '"url":' ios/App/App/capacitor.config.json; then
            echo "FATAL: capacitor.config 仍含 server.url（远程加载模式残留）"; exit 1
          fi
          echo "原生模式校验 OK: 内置资源已同步且无 server.url 残留"

      - name: Check signing credentials
        id: creds
        run: |
          if [ -n "${{ secrets.APP_STORE_CONNECT_KEY }}" ] && [ -n "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" ]; then
            echo "mode=signed" >> "$GITHUB_OUTPUT"
            echo "签名模式：App Store Connect API（P8）—— exportArchive 分发签名"
          else
            echo "mode=unsigned" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置 APP_STORE_CONNECT_KEY / APP_STORE_CONNECT_ISSUER_ID Secrets，将产出未签名 xcarchive"
          fi

      - name: Write API key
        if: steps.creds.outputs.mode == 'signed'
        run: |
          mkdir -p "$HOME/private_keys"
          printf '%s\n' "${{ secrets.APP_STORE_CONNECT_KEY }}" > "$HOME/private_keys/AuthKey_${KEY_ID}.p8"

      # 归档一律未签名（Automatic 开发签名会要求注册设备——见文件头注释）
      - name: Archive (unsigned)
        run: |
          cd ios/App
          rm -rf "$RUNNER_TEMP/App.xcarchive"
          xcodebuild archive \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO

      # 分发签名在导出阶段完成：自动创建 Apple Distribution 证书+注册 App ID+生成 App Store profile
      - name: Export ipa (distribution signing)
        id: export
        if: steps.creds.outputs.mode == 'signed'
        continue-on-error: true
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>WM586465ZD</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>uploadSymbols</key>
            <true/>
            <key>stripSwiftSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}"
          ls -la "$RUNNER_TEMP/export"

      - name: Upload ipa artifact
        if: steps.creds.outputs.mode == 'signed' && steps.export.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: yandao-guoxue-ios-ipa
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 14

      - name: Upload to TestFlight
        if: steps.creds.outputs.mode == 'signed' && steps.export.outcome == 'success' && inputs.upload_testflight
        run: |
          IPA=$(ls "$RUNNER_TEMP/export/"*.ipa | head -1)
          xcrun altool --upload-app --type ios -f "$IPA" --apiKey "$KEY_ID" --api-issuer "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}"

      - name: Upload unsigned xcarchive artifact
        if: steps.creds.outputs.mode == 'unsigned' || steps.export.outcome == 'failure'
        run: |
          cd "$RUNNER_TEMP"
          zip -r -q App.xcarchive.zip App.xcarchive

      - name: Upload archive artifact
        if: steps.creds.outputs.mode == 'unsigned' || steps.export.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: yandao-guoxue-ios-xcarchive-unsigned
          path: ${{ runner.temp }}/App.xcarchive.zip
          retention-days: 14

      - name: Build summary
        run: |
          echo "### iOS 构建结果" >> $GITHUB_STEP_SUMMARY
          echo "- 模式: ${{ steps.creds.outputs.mode }}" >> $GITHUB_STEP_SUMMARY
          echo "- Bundle: $BUNDLE_ID" >> $GITHUB_STEP_SUMMARY
          echo "- 资源: 原生内置 (API 改写到 https://yandaoguoxue.yandao.vip)" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.creds.outputs.mode }}" = "signed" ] && [ "${{ steps.export.outcome }}" = "success" ]; then
            echo "- 产物: 签名 ipa（exportArchive 分发签名；TestFlight 上传: ${{ inputs.upload_testflight }}）" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.creds.outputs.mode }}" = "signed" ]; then
            echo "- 产物: 未签名 xcarchive（exportArchive 签名失败已降级，见 Export ipa 步骤日志）" >> $GITHUB_STEP_SUMMARY
            echo "- 常见根因：PLA 未接受（账号持有人登录 developer.apple.com 接受协议）/ App ID 占用 / 密钥权限不足" >> $GITHUB_STEP_SUMMARY
          else
            echo "- 产物: 未签名 xcarchive（需补 APP_STORE_CONNECT_KEY / ISSUER_ID Secrets 后重跑可出签名 ipa）" >> $GITHUB_STEP_SUMMARY
          fi