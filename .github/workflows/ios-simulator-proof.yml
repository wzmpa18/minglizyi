name: Real iOS simulator study screenshots
on:
  push:
    paths:
      - '.github/workflows/ios-simulator-proof.yml'
      - 'scripts/ios-simulator-proof.rb'
      - 'scripts/ios-study-screenshots.swift'
  workflow_dispatch:
    inputs:
      private_only:
        description: Verify private vault and real native database only
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      NEXT_PUBLIC_STORE_CHANNEL: ios-full-learning
      GEM_HOME: /tmp/guoxue-screenshot-gems
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo xcode-select -s /Applications/Xcode_26.3.app
      - run: npm ci
      - name: Build actual bundled application and prepare UI-only test target
        run: |
          npm run build
          mkdir -p www
          cp -R out/. www/
          npx cap sync ios
          gem install xcodeproj -v 1.28.1 --no-document
          ruby scripts/ios-simulator-proof.rb
      - name: Capture real app on iPhone and iPad simulators
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/guoxue-screen-proof"
          python3 -c "import os,json;json.dump({'source':os.environ['GITHUB_SHA'],'channel':os.environ['NEXT_PUBLIC_STORE_CHANNEL'],'kind':'actual bundled app in simulator, not a physical device acceptance'},open(os.environ['RUNNER_TEMP']+'/guoxue-screen-proof/source.json','w'))"
          for kind in iphone ipad; do
            MODEL=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=[x for rows in json.load(sys.stdin)['devices'].values() for x in rows]; preferred=[x for x in d if ('iPhone' in x['name'] and 'Pro Max' in x['name'])] if '$kind'=='iphone' else [x for x in d if 'iPad Pro' in x['name'] and '13-inch' in x['name']]; print(preferred[0]['udid'] if preferred else '')")
            test -n "$MODEL"
            xcrun simctl boot "$MODEL" || true
            xcrun simctl bootstatus "$MODEL" -b
            xcrun simctl status_bar "$MODEL" override --time 09:41 --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState charged --batteryLevel 100
            set +e
            ONLY=""
            if [ "${{ inputs.private_only }}" = "true" ]; then ONLY="-only-testing:GuoxueStudyUITests/GuoxueStudyScreenshots/testLifePrivateNativeStorage"; fi
            xcodebuild test $ONLY -project ios/App/App.xcodeproj -scheme GuoxueScreenshots -configuration Debug -destination "id=$MODEL" -parallel-testing-enabled NO -derivedDataPath "$RUNNER_TEMP/guoxue-simulator-build" -resultBundlePath "$RUNNER_TEMP/$kind.xcresult" CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO
            TEST_STATUS=$?
            set -e
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/$kind.xcresult" --output-path "$RUNNER_TEMP/guoxue-screen-proof/$kind"
            if [ "$TEST_STATUS" -ne 0 ]; then exit "$TEST_STATUS"; fi
            GROUP=$(xcrun simctl get_app_container "$MODEL" com.yandaoguoxue.app group.com.yandaoguoxue.calendar)
            PRIVATE_CONTAINER=$(xcrun simctl get_app_container "$MODEL" com.yandaoguoxue.app data)
            python3 - "$PRIVATE_CONTAINER" "$RUNNER_TEMP/guoxue-screen-proof/${kind}_private-vault-proof.json" <<'PY'
          import json,sys,pathlib,sqlite3
          root=pathlib.Path(sys.argv[1]);p=root/'Library/Application Support/PrivateLifeVault/vault-v1.sqlite'
          db=sqlite3.connect(f'file:{p}?mode=ro',uri=True);rows=db.execute('SELECT k,v FROM vault_items').fetchall();db.close()
          assert any(':entry:' in k for k,v in rows)
          assert all('QA synthetic local record' not in v and 'Synthetic private note' not in v for k,v in rows)
          assert b'Synthetic private note' not in p.read_bytes()
          json.dump({'nativeSqliteWritten':True,'rows':len(rows),'syntheticPlaintextAbsent':True,'physicalDevice':False},open(sys.argv[2],'w'))
          PY
            if [ "${{ inputs.private_only }}" != "true" ]; then
            python3 scripts/verify-ios-learning-files.py "$PRIVATE_CONTAINER" "$RUNNER_TEMP/guoxue-screen-proof/${kind}_native-learning-files.json"
            python3 -c "import json,sys,pathlib; p=pathlib.Path(sys.argv[1])/'calendar-v1.json'; data=json.loads(p.read_text()); assert data['snapshot']['schemaVersion']==1 and len(data['snapshot']['entries'])>1; assert all(set(x)=={'at'} for x in data['agenda']); json.dump({'sharedContainerWritten':True,'snapshotEntries':len(data['snapshot']['entries']),'privateAgendaItems':len(data['agenda']),'reminders':len(data['reminders'])},open(sys.argv[2],'w'))" "$GROUP" "$RUNNER_TEMP/guoxue-screen-proof/${kind}_shared-container-proof.json"
            fi
            xcrun simctl shutdown "$MODEL"
          done
      - name: Preserve authentic screenshot evidence, including failed UI steps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-ios-study-screenshots
          path: |
            ${{ runner.temp }}/guoxue-screen-proof/
          retention-days: 2
