          npx tsx scripts/test_qizheng_dst.ts
          npx tsx scripts/test_qizheng_layers.ts
          npx tsx scripts/test_qizheng_liunian.ts
          npx tsx scripts/test_qizheng_duanyu.ts
      - run: npx tsx --test scripts/planetarium-projection.test.ts
      - run: node --experimental-strip-types --test scripts/offline-versions.test.cjs
      - run: node --experimental-strip-types --test scripts/offline-download-link.test.cjs
      - run: node --test scripts/user-id-policy.test.cjs
      - run: node --experimental-strip-types --test scripts/study-content.test.cjs
      - run: node --test scripts/learning-cors.test.cjs
