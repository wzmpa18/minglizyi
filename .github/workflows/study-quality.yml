      - run: node --experimental-strip-types --test scripts/cloud-record-privacy.test.cjs
      - run: node --test scripts/native-listening.test.cjs
      - name: Verify discussion HTTP authentication and moderation against production dependency versions
        run: |
          npm install --prefix "$RUNNER_TEMP/study-http-deps" --no-save --package-lock=false express@4.22.2 better-sqlite3@13.0.3 jsonwebtoken@9.0.3 bcrypt@6.0.0 fake-indexeddb@6.2.4
          NODE_PATH="$RUNNER_TEMP/study-http-deps/node_modules" node --test scripts/offline-pack-client.test.cjs scripts/anatomy-learning-bundle.test.cjs scripts/acupoint-classic-study.test.cjs
          NODE_PATH="$RUNNER_TEMP/study-http-deps/node_modules" node --test scripts/password-reset-http.test.cjs
          node --test scripts/discover-video-link.test.cjs
          node --test scripts/safe-rich-text.test.cjs
          NODE_PATH="$RUNNER_TEMP/study-http-deps/node_modules" node --test scripts/study-comments-http.test.cjs
          NODE_PATH="$RUNNER_TEMP/study-http-deps/node_modules" node --test scripts/security-assessment-http.test.cjs
          NODE_PATH="$RUNNER_TEMP/study-http-deps/node_modules" node --test scripts/live-chart-http.test.cjs
          NODE_PATH="$RUNNER_TEMP/study-http-deps/node_modules" node --test scripts/governed-groups-http.test.cjs
          NODE_PATH="$RUNNER_TEMP/study-http-deps/node_modules" node --test scripts/academy-admin-http.test.cjs
          NODE_PATH="$RUNNER_TEMP/study-http-deps/node_modules" node --test scripts/provider-auth-http.test.cjs
          NODE_PATH="$RUNNER_TEMP/study-http-deps/node_modules" node --test scripts/offline-download-http.test.cjs
          NODE_PATH="$RUNNER_TEMP/study-http-deps/node_modules" node --test scripts/zhenggu-preview-http.test.cjs
      - name: Verify Apple signature rejection and authenticated purchase endpoints with real dependencies
        run: |
          npm ci --prefix backend_deploy/apple-iap-runtime --ignore-scripts
          NODE_PATH="$RUNNER_TEMP/study-http-deps/node_modules" node --test scripts/apple-iap-http.test.cjs
      - name: Verify original edition chapter sequence and provenance
        run: |
          python3 scripts/import_tcm_clinical_editions.py
          python3 scripts/import_jingfang_originals.py
          python3 scripts/jingfang-import.test.py
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const book = JSON.parse(fs.readFileSync('src/data/nanjingOriginal.json', 'utf8'));
          assert.equal(book.chapters.length, 81);
          assert.equal(new Set(book.chapters.map(c => c.id)).size, 81);
          book.chapters.forEach((chapter, index) => {
            assert.equal(chapter.id, `nanjing-original-${index + 1}`);
            assert.ok(chapter.content.length >= 20);
            assert.ok(!chapter.content.includes('【白话提要】'));
            assert.ok(!/Public domain|此作品在|\[\d+\]/.test(chapter.content));
          });
          assert.match(book.sourceRevisionUrl, /^https:\/\/zh\.wikisource\.org\/w\/index\.php\?oldid=\d+$/);
          assert.ok(book.license && book.verification && book.contentSha256.length === 64);
          console.log('PASS: 81 attributed original chapters; no AI-summary blocks.');
          const editions = JSON.parse(fs.readFileSync('src/data/tcmOriginalEditions.json', 'utf8'));
          assert.deepEqual(editions.map(b => [b.id, b.chapters.length, b.sourcePages.length]), [
            ['suwen-original', 81, 24], ['lingshu-original', 81, 12], ['shennong-original', 19, 1]
          ]);
          for (const edition of editions) {
            assert.equal(new Set(edition.chapters.map(c => c.id)).size, edition.chapters.length);
            assert.ok(edition.chapters.every(c => c.title && c.content.length > 20 && !/Public domain|此作品在|【白话提要】/.test(c.content)));
            assert.ok(edition.sourcePages.every(p => /^https:\/\/zh\.wikisource\.org\/w\/index\.php\?oldid=\d+$/.test(p.revisionUrl)));
          }
          console.log('PASS: Suwen 81 chapters, Lingshu 81 chapters, Shennong 19 source sections, 37 revision links.');
          JS
      - name: Build review preview
        if: inputs.preview == true
        env:
          NEXT_PUBLIC_STORE_CHANNEL: ${{ inputs.store_channel || 'tencent' }}
        run: |
          npm run build
          node scripts/verify-static-cache-boundary.cjs
      - name: Upload review preview
        if: inputs.preview == true
        uses: actions/upload-artifact@v4
        with:
          name: study-layout-review-preview
          path: out/
          retention-days: 2
