name: Study content and layout quality
on:
  push:
    paths:
      - '.github/workflows/study-quality.yml'
      - 'src/data/nanjingOriginal.json'
      - 'src/data/tcmOriginalEditions.json'
      - 'src/algorithm-core/modules/tcm/classics.ts'
      - 'src/algorithm-core/modules/bazi/base.ts'
      - 'scripts/bazi-yun-metadata.test.ts'
      - 'src/app/zhongyi/classic/page.tsx'
      - 'src/app/yixue/ziwei/page.tsx'
      - 'src/app/yixue/bazi/page.tsx'
      - 'src/components/ContinuousListenPlayer.tsx'
      - 'src/components/ProfessionalZiweiBoard.tsx'
      - 'src/components/LocalStudyNotes.tsx'
      - 'src/components/LocalChartArchive.tsx'
      - 'src/app/yixue/daliuren/page.tsx'
      - 'src/components/ResourceDiscussion.tsx'
      - 'backend_deploy/resourceDiscussionQueries.js'
      - 'backend_deploy/socialApiRoutes.js'
      - 'scripts/resource-discussion.test.cjs'
      - 'src/lib/listeningQueue.ts'
      - 'scripts/continuous-listening.test.ts'
      - 'src/app/academy/learn/page.tsx'
      - 'src/app/academy/start/page.tsx'
      - 'src/app/books/page.tsx'
      - 'src/app/yixue/learn/page.tsx'
      - 'src/app/zhongyi/**/layout.tsx'
      - 'src/app/zhongyi/ClientShell.tsx'
      - 'src/lib/toolNavData.ts'
      - 'src/app/zhongyi/meridian/page.tsx'
      - 'src/components/AcupointStudySources.tsx'
      - 'src/data/acupointOpenSources.json'
      - 'src/lib/tcmScraper.ts'
      - 'public/assets/meridians/lung-open-reference.svg'
      - 'scripts/acupoint-study.test.ts'
  workflow_dispatch:
    inputs:
      preview:
        description: Build a static review preview without publishing
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx tsc --noEmit --incremental false
      - run: npx tsx --test scripts/continuous-listening.test.ts
      - run: npx tsx --test scripts/bazi-yun-metadata.test.ts
      - run: node --test scripts/resource-discussion.test.cjs
      - run: npx tsx --test scripts/acupoint-study.test.ts
      - name: Verify original edition chapter sequence and provenance
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const book = JSON.parse(fs.readFileSync('src/data/nanjingOriginal.json', 'utf8'));
          assert.equal(book.chapters.length, 81);
          assert.equal(new Set(book.chapters.map(c => c.id)).size, 81);
          book.chapters.forEach((chapter, index) => {
            assert.equal(chapter.id, `nanjing-original-${index + 1}`);
            assert.ok(chapter.content.length >= 20);
            assert.ok(!chapter.content.includes('【白话提要】'));
            assert.ok(!/Public domain|此作品在|\[\d+\]/.test(chapter.content));
          });
          assert.match(book.sourceRevisionUrl, /^https:\/\/zh\.wikisource\.org\/w\/index\.php\?oldid=\d+$/);
          assert.ok(book.license && book.verification && book.contentSha256.length === 64);
          console.log('PASS: 81 attributed original chapters; no AI-summary blocks.');
          const editions = JSON.parse(fs.readFileSync('src/data/tcmOriginalEditions.json', 'utf8'));
          assert.deepEqual(editions.map(b => [b.id, b.chapters.length, b.sourcePages.length]), [
            ['suwen-original', 81, 24], ['lingshu-original', 81, 12], ['shennong-original', 19, 1]
          ]);
          for (const edition of editions) {
            assert.equal(new Set(edition.chapters.map(c => c.id)).size, edition.chapters.length);
            assert.ok(edition.chapters.every(c => c.title && c.content.length > 20 && !/Public domain|此作品在|【白话提要】/.test(c.content)));
            assert.ok(edition.sourcePages.every(p => /^https:\/\/zh\.wikisource\.org\/w\/index\.php\?oldid=\d+$/.test(p.revisionUrl)));
          }
          console.log('PASS: Suwen 81 chapters, Lingshu 81 chapters, Shennong 19 source sections, 37 revision links.');
          JS
      - name: Build review preview
        if: inputs.preview == true
        env:
          NEXT_PUBLIC_STORE_CHANNEL: tencent
        run: npm run build
      - name: Upload review preview
        if: inputs.preview == true
        uses: actions/upload-artifact@v4
        with:
          name: study-layout-review-preview
          path: out/
          retention-days: 2
