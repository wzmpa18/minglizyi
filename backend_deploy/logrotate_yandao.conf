# 言道国学 logrotate 配置（fc9）
# 覆盖：nginx 站点日志 + PM2 应用日志
# 用法：cp 到 /etc/logrotate.d/yandao-guoxue 后自动由系统 cron 每日轮转

/www/wwwlogs/yandaoguoxue.yandao.vip.log
/www/wwwlogs/yandaoguoxue.yandao.vip.error.log
{
    daily
    rotate 14
    missingok
    notifempty
    compress
    delaycompress
    dateext
    sharedscripts
    postrotate
        [ -f /var/run/nginx.pid ] && kill -USR1 "$(cat /var/run/nginx.pid)" 2>/dev/null || true
    endscript
}

/root/.pm2/logs/yandaoguoxue-backend-out.log
/root/.pm2/logs/yandaoguoxue-backend-error.log
{
    daily
    rotate 14
    maxsize 50M
    missingok
    notifempty
    compress
    delaycompress
    dateext
    copytruncate
}
