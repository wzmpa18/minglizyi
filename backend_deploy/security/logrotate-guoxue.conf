/www/wwwlogs/yandaoguoxue.yandao.vip.log
/www/wwwlogs/yandaoguoxue.yandao.vip.error.log
{
    daily
    rotate 200
    missingok
    notifempty
    compress
    delaycompress
    dateext
    create 0600 root root
    sharedscripts
    postrotate
        if [ -f /www/server/nginx/logs/nginx.pid ]; then
            kill -USR1 "$(cat /www/server/nginx/logs/nginx.pid)" 2>/dev/null || true
        elif [ -f /var/run/nginx.pid ]; then
            kill -USR1 "$(cat /var/run/nginx.pid)" 2>/dev/null || true
        fi
    endscript
}

/root/.pm2/logs/yandaoguoxue-backend-out.log
/root/.pm2/logs/yandaoguoxue-backend-error.log
{
    daily
    rotate 200
    missingok
    notifempty
    compress
    delaycompress
    dateext
    copytruncate
}
