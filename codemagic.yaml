# Codemagic CI/CD - 言道国学 iOS (FINAL-RC-02)
# 工程: ios/ 已正式入库Git(Bundle ID com.yandao.guoxue/AppIcon/PrivacyInfo/LaunchScreen)
# 签名: App Store Connect API Key (Key ID: UWQ354QP54) — 在Codemagic控制台 Teams→Integrations→App Store Connect 添加.p8密钥
# Issuer ID: 需在ASC后台 Users and Access→Integrations 查看(形如xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx)并配置到集成
workflows:
  ios-workflow:
    name: 言道国学 iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 20
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.yandao.guoxue
    scripts:
      - name: 安装依赖
        script: |
          npm ci --legacy-peer-deps
      - name: Web构建(静态导出)
        script: |
          bash build.sh
      - name: 同步Web资源到iOS工程(已入库的正式工程)
        script: |
          npx cap sync ios
      - name: 显示版本信息
        script: |
          cat public/version.json
          grep -A1 "MARKETING_VERSION" ios/App/App.xcodeproj/project.pbxproj | head -2
      - name: CocoaPods安装
        script: |
          cd ios/App && pod install
      - name: 构建IPA
        script: |
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App \
            --configuration Release \
            --archive-flags="-destination 'generic/platform=iOS'"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        # 方式A(推荐): Codemagic控制台 Teams→Integrations→App Store Connect 上传.p8
        #   (Key ID: UWQ354QP54; Issuer ID 在ASC后台 Users and Access→Integrators 查看)
        #   控制台集成后以下 api_key/key_id/issuer_id 三行可删除
        # 方式B: 在 Codemagic App→Environment variables 配置以下三个变量(encrypted)
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        notify_testers: false
        # 首版仅TestFlight，不提交App Store审核（TestFlight通过+真机E2E后再开）