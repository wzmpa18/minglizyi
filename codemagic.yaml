# Codemagic CI/CD - 言道国学 iOS (FINAL-RC-02) + Android 离线完整包 (v25.0.53 / DEV-V22)
# 工程: ios/ 与 android/ 均已正式入库Git
#
# Android 签名（一次性配置）：
#   Codemagic 控制台 → 应用 (wzmpa18/minglizyi) → Environment variables → 新增：
#     名称: ANDROID_KEYSTORE_B64   值: yandao-release.keystore 文件的 base64（Secure 勾选）
#     生成命令: base64 -w0 yandao-release.keystore
#   keystore 密码/别名已写入 android/app/build.gradle signingConfigs（yandao2024/yandao）
#   云端构建产物: app-release.apk（离线完整包，Web资源内置 assets/public，仅API走线上）
#
# iOS 签名: App Store Connect API Key (Key ID: UWQ354QP54) — 在Codemagic控制台 Teams→Integrations→App Store Connect 添加.p8密钥
# Issuer ID: 需在ASC后台 Users and Access→Integrations 查看(形如xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx)并配置到集成
workflows:
  android-workflow:
    name: 言道国学 Android APK（离线完整安装包）
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      node: 20
      java: 21
    scripts:
      - name: 安装依赖
        script: |
          npm ci --legacy-peer-deps
      - name: Web构建(静态导出)
        script: |
          bash build.sh
      - name: 同步Web资源到Android工程(www→assets/public)
        script: |
          rm -rf www && cp -a out www
          npx cap sync android
      - name: 恢复签名证书(加密变量ANDROID_KEYSTORE_B64)
        script: |
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > yandao-release.keystore
          keytool -list -v -keystore yandao-release.keystore -storepass yandao2024 -alias yandao | sed -n '1,8p'
      - name: 构建APK
        script: |
          cd android && ./gradlew assembleRelease
      - name: 校验版本号与签名
        script: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)
          "$AAPT" dump badging "$APK" | head -2
          jarsigner -verify "$APK" && echo "签名校验 OK"
    artifacts:
      - android/app/build/outputs/apk/release/*.apk
  ios-workflow:
    name: 言道国学 iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 20
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.yandaoguoxue.app
    scripts:
      - name: 安装依赖
        script: |
          npm ci --legacy-peer-deps
      - name: Web构建(静态导出)
        script: |
          bash build.sh
      - name: 同步Web资源到iOS工程(已入库的正式工程)
        script: |
          npx cap sync ios
      - name: 显示版本信息
        script: |
          cat public/version.json
          grep -A1 "MARKETING_VERSION" ios/App/App.xcodeproj/project.pbxproj | head -2
      # 依赖管理为 SPM（CapApp-SPM + capacitor-swift-pm 8.5.0，见 project.pbxproj 的
      # XCLocalSwiftPackageReference），xcodebuild 自动解析拉取——无 Podfile，禁用 pod install
      - name: 构建IPA
        script: |
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App \
            --configuration Release \
            --archive-flags="-destination 'generic/platform=iOS'"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        # 方式A(推荐): Codemagic控制台 Teams→Integrations→App Store Connect 上传.p8
        #   (Key ID: UWQ354QP54; Issuer ID 在ASC后台 Users and Access→Integrators 查看)
        #   控制台集成后以下 api_key/key_id/issuer_id 三行可删除
        # 方式B: 在 Codemagic App→Environment variables 配置以下三个变量(encrypted)
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        notify_testers: false
        # 首版仅TestFlight，不提交App Store审核（TestFlight通过+真机E2E后再开）